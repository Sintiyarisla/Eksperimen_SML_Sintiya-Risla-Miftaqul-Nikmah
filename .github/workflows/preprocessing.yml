name: Preprocessing Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  preprocess:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Library
        run: |
          pip install pandas numpy scikit-learn

      - name: Run Script
        run: |
          cd preprocessing
          python automate_Sintiya-Risla-Miftaqul-Nikmah.py

      - name: Save Result
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add preprocessing/dataset_preprocessing/data_clean.csv
          git commit -m "update preprocessing data" || echo "no change"
          git push